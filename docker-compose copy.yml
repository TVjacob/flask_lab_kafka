version: '3.9'

services:
  # ========================
  # Zookeeper
  # ========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.4-1-ubi8.arm64
    container_name: zookeeper
    platform: linux/arm64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ========================
  # Kafka Brokers
  # ========================
  kafka1:
    image: confluentinc/cp-kafka:7.5.0.arm64
    container_name: kafka1
    platform: linux/arm64
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  kafka2:
    image: confluentinc/cp-kafka:7.5.0.arm64
    container_name: kafka2
    platform: linux/arm64
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  kafka3:
    image: confluentinc/cp-kafka:7.5.0.arm64
    container_name: kafka3
    platform: linux/arm64
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  kafka4:
    image: confluentinc/cp-kafka:7.5.0.arm64
    container_name: kafka4
    platform: linux/arm64
    ports:
      - "9095:9092"
    environment:
      KAFKA_BROKER_ID: 4
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka4:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'




  # ========================
  # Flask Backend
  # ========================
  flask_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask_lab
    ports:
      - "5080:5080"
    volumes:
      - .:/app
    environment:
      FLASK_ENV: development
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - kafka4





  # ========================
  # Vue Frontend
  # ========================
  vue_frontend:
    build:
      context: ./frontend/lab-frontend
      dockerfile: Dockerfile
    container_name: vue_lab_frontend
    ports:
      - "5177:5177"
    volumes:
      - ./frontend/lab-frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - flask_app




  # ========================
  # AKHQ Dashboard
  # ========================
  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    platform: linux/arm64
    ports:
      - "9500:8080"
    volumes:
      - ./application.yml:/app/application.yml
    environment:
      MICRONAUT_CONFIG_FILES: /app/application.yml
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - kafka4
