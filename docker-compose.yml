version: '3.9'

services:

  # ========================
  # Zookeeper (ARM64)
  # ========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.4-1-ubi8.arm64
    container_name: zookeeper
    platform: linux/arm64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000


  # ========================
  # Kafka Brokers (ARM64)
  # ========================
  kafka1:
    image: confluentinc/cp-kafka:7.5.0.arm64
    container_name: kafka1
    platform: linux/arm64
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper

  kafka2:
    image: confluentinc/cp-kafka:7.5.0.arm64
    container_name: kafka2
    platform: linux/arm64
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper

  kafka3:
    image: confluentinc/cp-kafka:7.5.0.arm64
    container_name: kafka3
    platform: linux/arm64
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper

  kafka4:
    image: confluentinc/cp-kafka:7.5.0.arm64
    container_name: kafka4
    platform: linux/arm64
    ports:
      - "9095:9092"
    environment:
      KAFKA_BROKER_ID: 4
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka4:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper


  # ========================
  # Unified Flask + Vue App
  # ========================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab_fullstack
    platform: linux/arm64
    ports:
      - "5080:5080"   # Flask backend API
      - "5177:5177"   # Vue frontend dev server
    volumes:
      - .:/app                      # Sync source code
      - node_modules:/app/node_modules
      - node_modules_fe:/app/frontend/lab-frontend/node_modules
    environment:
      FLASK_ENV: development
      CHOKIDAR_USEPOLLING: "true"  # For Vue hot reload on Docker/Mac
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - kafka4


  # ========================
  # AKHQ Dashboard
  # ========================
  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    platform: linux/arm64
    ports:
      - "9500:8080"
    volumes:
      - ./application.yml:/app/application.yml
    environment:
      MICRONAUT_CONFIG_FILES: /app/application.yml
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - kafka4


# ========================
# Named Volumes
# ========================
volumes:
  node_modules:
  node_modules_fe:
